stages:
  - build
  - deploy

build:
  stage: build
  image: python:3.12-alpine
  before_script:
    - pip install mkdocs mkdocs-material
  script:
    - mkdocs build -s
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  artifacts:
    paths:
      - site

deploy:
  stage: deploy
  image: google/cloud-sdk:latest
  script:
    - apt install jq -y
    - export GOOGLE_CLOUD_CREDENTIALS=$(echo $BASE64_GOOGLE_CLOUD_CREDENTIALS | base64 -d)
    - echo $GOOGLE_CLOUD_CREDENTIALS > service-account-key.json
    - gcloud auth activate-service-account --key-file service-account-key.json
    - gcloud config set project $PROJECT_ID
    - gcloud auth configure-docker
    - merge_request_id=$(curl --request GET "https://lab.civicrm.org/api/v4/projects/877/merge_requests?scope=all&state=opened&sha=${CI_COMMIT_REF_NAME}" | jq .[0].iid)
    - gsutil -q -m rsync -r "site/" "gs://$SERVICE_ID/docs/user/en/$merge_request_id/"
    - echo View online at https\://ephemera.civicrm.org/docs/user/en/$merge_request_id/index.html
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  dependencies:
    - build
